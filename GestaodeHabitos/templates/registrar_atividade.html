{% extends "base.html" %}

{% block title %}Registrar Atividade{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">

            <div class="card-header bg-warning">
                <h4>Registrar: {{ atividade.nome_atividade }}</h4>
            </div>

            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label>Data (opcional)</label>
                        <input type="date" name="data" class="form-control"
                               value="{{ hoje|date:'Y-m-d' }}">
                        <small>Deixe em branco para usar hoje</small>
                    </div>

                    <button type="submit" class="btn btn-warning">
                        Registrar
                    </button>

                    <a href="{% url 'home' %}" class="btn btn-secondary">
                        Voltar
                    </a>
                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
